name: Build FRAME

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed.' }
      - name: Install LLVM 21
        shell: pwsh
        run: |
          $taskInstaller = Join-Path $env:RUNNER_TEMP 'LLVM-21.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe' -OutFile $taskInstaller
          $taskExpected = '7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113'
          if ((Get-FileHash -LiteralPath $taskInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $taskExpected) { throw 'LLVM checksum mismatch.' }
          $taskProcess = Start-Process -FilePath $taskInstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'LLVM installation failed.' }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $taskVersion = (Get-Content mod.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne ('v' + $taskVersion)) { throw 'Tag and manifest versions differ.' }
      - name: Test, build and package
        shell: pwsh
        run: ./build.ps1
      - name: Upload tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FRAME-Windows-${{ github.sha }}
          path: |
            dist/zemci.frame.geode
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FRAME-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/frame-ci-package
      - name: Assemble clean archives
        shell: pwsh
        run: ./scripts/bundle.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'frame-ci-package')
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskFiles = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -eq 'zemci.frame.geode' -or $_.Name -like 'FRAME-*.zip' -or $_.Name -eq 'SHA256.txt' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @taskFiles --verify-tag --title "FRAME $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten.' }
